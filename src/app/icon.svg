<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Subra">
  <!-- Same geometry as the navbar mark. The rules are painted rather than
       punched: at 16px a tab strip can be any colour, so the mark carries
       its own ground. Ink-on-paper flips for dark tab bars. -->
  <style>
    .sq { fill: #15161A }
    .ru { fill: #EDEAE4 }
    @media (prefers-color-scheme: dark) {
      .sq { fill: #F3F0EA }
      .ru { fill: #15161A }
    }
  </style>
  <path class="sq" d="M6.4 1.6H17.6A4.8 4.8 0 0 1 22.4 6.4V17.6A4.8 4.8 0 0 1 17.6 22.4H6.4A4.8 4.8 0 0 1 1.6 17.6V6.4A4.8 4.8 0 0 1 6.4 1.6Z"/>
  <rect class="ru" x="7" y="6.4" width="10" height="2.2"/>
  <rect class="ru" x="7" y="10.9" width="10" height="2.2"/>
  <rect x="7" y="15.4" width="5.6" height="2.2" fill="#F0803C"/>
</svg>
