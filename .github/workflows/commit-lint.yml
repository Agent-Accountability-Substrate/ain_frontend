name: Commit Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commit-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # Conventional Commits, enforced in CI only — no local git hooks (DECISIONS.md,
      # 2026-07-03: "no pre-commit hooks; CI is the gate"). The ruleset lives in
      # .commitlintrc.json; commitlint is fetched pinned via npx so this workflow is
      # byte-identical across the Python repos, the frontend, and docs (no per-repo
      # Node toolchain required). Under squash-to-land the PR title is what reaches
      # main, so the title check is the load-bearing one; the commit check is hygiene.
      - name: Lint PR title (conventional)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          printf '%s\n' "$PR_TITLE" |
          npx --yes
          --package @commitlint/cli@21.0.2
          --package @commitlint/config-conventional@21.0.2
          commitlint --verbose
      - name: Lint PR commits (conventional)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          npx --yes
          --package @commitlint/cli@21.0.2
          --package @commitlint/config-conventional@21.0.2
          commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
